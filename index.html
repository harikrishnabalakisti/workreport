<!DOCTYPE html>
<html>
<head>
  <title>Work Report System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Link CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <div class="title-box">
  <img src="https://media.licdn.com/dms/image/v2/D4D0BAQG05-WSiEsdAA/company-logo_200_200/B4DZfGSrDgGkAI-/0/1751378473804?e=1775692800&v=beta&t=L1CKGCyA2QWlb2Z_rNprsf1zWoyYZLHCrWIx4-UQlNw" width="100px" height="100px" class="logo">
    <h2>YugPrerna Welfare Foundation</h2>
</div>
 <h3 class="sub-title">Daily Work Report</h3>

  <form id="form" method="post" name="google-sheet">

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="date">Date</label>
    <input type="date" id="date" name="date" required>

    <label for="work">Work Update</label>
    <textarea id="work" name="work" rows="4" placeholder="Type or use voice..." required></textarea>

    <button type="button" class="voice-btn" onclick="startVoice()">🎤 Start Voice</button>

    <button type="submit" class="submit-btn">Submit</button>

  </form>

  <div class="status" id="msg"></div>
</div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbxB_e5vn4a2LWLn5W36pXEixcle18fn7UAPzlchHcmvmWolGNd_nb-gV4Jom7yhAZCdYg/exec'
const form = document.forms['google-sheet']
const msg = document.getElementById("msg")

form.addEventListener('submit', e => {
  e.preventDefault()
  
  fetch(scriptURL, { method: 'POST', body: new FormData(form)})
    .then(response => {
      msg.innerHTML = "✅ Submitted Successfully!"
      speak("Form submitted successfully")
      form.reset()
      setTimeout(() => msg.innerHTML = "", 3000)
    })
    .catch(error => {
      msg.innerHTML = "❌ Error occurred!"
      speak("Error occurred")
    })
})

/* 🎤 Voice Input */
function startVoice() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-IN";

  recognition.start();

  speak("Listening, please speak your work update")

  recognition.onresult = function(event) {
    document.getElementById("work").value += " " + event.results[0][0].transcript;
    speak("Text added")
  }
}

/* 🔊 Text to Speech */
function speak(text) {
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-IN";
  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
